plugins {
    id 'com.android.application'
}

android {
    namespace 'org.rota.mapaoffline'
    compileSdk 35

    defaultConfig {
        applicationId 'org.rota.mapaoffline'
        minSdk 24          // Android 7.0 ou mais recente
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    // Chave fixa (incluída no projeto) para cada APK novo instalar POR CIMA do anterior
    // sem desinstalar — assim os mapas copiados para o telemóvel não se perdem.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
}

// Sem dependências: só o SDK do Android.
