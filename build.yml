# Compila o APK (Java puro, só SDK Android) na nuvem do GitHub. Demora ~3-5 minutos.
# Separador "Actions" -> "Compilar APK" -> no fim descarrega o artefacto "mapa-offline-apk".
# Se falhar: o resumo do erro aparece no passo "Mostrar o erro" e o registo completo
# fica no artefacto "registo-do-erro".
name: Compilar APK

on:
  push:
  workflow_dispatch:

env:
  GRADLE_VERSAO: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verificar ficheiros
        run: |
          ok=1
          for f in settings.gradle build.gradle app/build.gradle app/debug.keystore \
                   app/src/main/AndroidManifest.xml app/src/main/java/org/rota/mapaoffline/MainActivity.java; do
            if [ ! -f "$f" ]; then echo "::error::Falta o ficheiro $f"; ok=0; fi
          done
          [ "$ok" = 1 ]

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/gradle-${{ env.GRADLE_VERSAO }}
          key: gradle-${{ env.GRADLE_VERSAO }}-${{ hashFiles('**/*.gradle') }}

      - name: Instalar Gradle
        run: |
          if [ ! -x "$HOME/gradle-$GRADLE_VERSAO/bin/gradle" ]; then
            wget -q "https://services.gradle.org/distributions/gradle-$GRADLE_VERSAO-bin.zip" -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d "$HOME"
          fi
          echo "$HOME/gradle-$GRADLE_VERSAO/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: |
          set +e
          echo "SDK Android: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Mostrar o erro
        if: failure()
        run: |
          echo "=============== ÚLTIMAS 120 LINHAS DO REGISTO ==============="
          tail -n 120 build.log 2>/dev/null || echo "(sem build.log: o erro foi num passo anterior)"

      - name: Guardar registo completo
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: registo-do-erro
          path: build.log
          if-no-files-found: ignore

      - name: Dar nome ao APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MapaOffline.apk

      - uses: actions/upload-artifact@v6
        with:
          name: mapa-offline-apk
          path: MapaOffline.apk
